<!-- CURSOR -->
<div
  class="cursor"
  [class.big]="cursorBig"
  [style.left.px]="cursorX"
  [style.top.px]="cursorY"
></div>
<div
  class="cursor-trail"
  [style.left.px]="trailX"
  [style.top.px]="trailY"
></div>

<!-- AMBIENT BG ORBS -->
<div class="lightning-bg"></div>

<!-- AUDIO BUTTON -->
<button
  class="audio-btn"
  [class.muted]="!audioOn"
  (click)="toggleAudio()"
  (mouseenter)="onHoverInteractive(true)"
  (mouseleave)="onHoverInteractive(false)"
  title="Toggle ambient audio"
>
  <div class="bars">
    <span></span><span></span><span></span><span></span>
  </div>
  <span>{{ audioOn ? 'playing' : 'ambient' }}</span>
</button>

<!-- PAGE -->
<app-home />
